---
name: NoPro200 - DSS VoIP Notifier
version: 5.0.0
slug: nopro200_dss_voip
description: VoIP Notifier for Home Assistant
url: https://github.com/NoPro200/hassio-addons/tree/main/dss_voip
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stdin: true
homeassistant_api: true
map:
  - type: share
    read_only: false
options:
  sip_parameters:
    caller_id_uri: sip:username@sipserver.com
    realm: "*"
    username: username
    password: password
schema:
  sip_parameters:
    sip_server_uri: str?
    caller_id_uri: str
    realm: str?
    username: str?
    password: password?
  ring_timeout: int(5,300)?
  retry_timeout: int(0,3600)?
  retry_delay: int(0,300)?
  message_repeat: int(1,20)?
  redial_on_busy: bool?
  max_call_time: int(-1,600)?
  platform_tts: str?
  tts_language: str?
  pjsua_custom_options: str?
  sox_custom_options_input_file: str?
  sox_custom_options_output_file: str?
